name: Shaheen patrol — rotating shifts (each role monitored every 3 hours)

# «الدورية بالتناوب»: three shifts take turns, one per hour, so only one group of probes runs at a time and the
# site feels no load — store & pricing, then content & visitor experience, then reliability & leadership; each
# role is monitored every 3 hours (8 times a day), at most 3 approved workflows restarted and 1 question to Shaheen per shift.
# Minute 52: clear of the importer and the studio bridge (minute 37) and the other robots' schedules.
# In its shift the patrol reviews each role's available report, last run or supervisor score, plus the defined
# hands-on tests for its scope (prices = supplier + 50%, one currency per country, live product pages, photos,
# sitemap, news, server, payment methods). Roles without a workflow (including the design expert) are observed
# from existing records; they are not invoked automatically. Safe fixes rerun only an approved workflow (at most
# once per 6 hours); unresolved issues go to Shaheen (AI diagnosis when available, otherwise his recorded playbook
# and an honest wait) and, if still broken, become a «shaheen-task» issue for the coding agent. Shared problems
# get a task force; each completed workflow is tested by an expert reviewer of the same scope.
# Code: scripts/shaheen-patrol/. Result: src/data/live/shaheen-patrol.json (admin → «الهيكل الإداري»),
# published only when something changed or every 3 hours (no commit every hour). Manual run: pick a shift or
# «all» for one full monitoring pass across roles and probes (it does not invoke every advisory agent).

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'Shift: auto (this hour), 0 store & pricing, 1 content & visitors, 2 reliability & leadership, all'
        type: choice
        options: [auto, '0', '1', '2', all]
        default: auto
  push:
    branches: ['arena/**']
    paths: ['scripts/shaheen-patrol/**', '.github/workflows/shaheen-patrol.yml']

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: shaheen-patrol-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # «مفتاح صاحب الموقع»: the owner can pause this robot or freeze every robot (src/data/owner/controls.json,
  # changed only from his GitHub account through «مكتب صاحب الموقع»). Branch and pull-request runs are not affected.
  owner:
    name: Owner's switch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Read the owner's switches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/data/owner
            scripts/owner
      - name: May this robot run?
        id: gate
        run: node scripts/owner/gate.mjs patrol

  patrol:
    name: Hourly patrol
    needs: owner
    if: needs.owner.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Branch pushes rehearse: the patrol runs and shows its findings; nothing started, opened or committed.
      PATROL_ACT: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      PATROL_SHIFT: ${{ inputs.shift != 'auto' && inputs.shift || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Every tool inspects its work
        id: patrol
        run: node --import tsx scripts/shaheen-patrol/run.mts
      - name: Publish the patrol log on main
        if: env.PATROL_ACT == 'true' && steps.patrol.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen patrol bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/publish.mjs "الدورية بالتناوب: $(date -u +'%Y-%m-%d %H:%M')" src/data/live/shaheen-patrol.json src/data/live/ai-quota.json \
            src/data/live/shaheen-blocks.json \
            || { echo "::error::Could not push the patrol log"; exit 1; }
      - name: Start the robots that fix what broke
        if: env.PATROL_ACT == 'true' && steps.patrol.outputs.reruns != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RERUNS: ${{ steps.patrol.outputs.reruns }}
        run: |
          for wf in $RERUNS; do
            case "$wf" in
              shaheen-import.yml|shaheen-discover.yml|shaheen-news.yml|shaheen-seo.yml|shaheen-languages.yml|pages.yml|product-pages-check.yml|live-smoke.yml|shaheen-precheck.yml)
                gh workflow run "$wf" --ref main && echo "::notice::Started $wf" || echo "::warning::Could not start $wf" ;;
              *) echo "::warning::Ignored unknown workflow $wf" ;;
            esac
          done
