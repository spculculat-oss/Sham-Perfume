name: Voice probe (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Speed and faithfulness of the new request (status and transcript only, never the key)
        run: |
          note() { echo "::notice title=$1::$(printf '%s' "$2" | head -c 1500 | tr '\n\r' '  ')"; }
          A=https://generativelanguage.googleapis.com/v1beta/models
          H="x-goog-api-key: $GEMINI_API_KEY"
          SHORT='أهلاً بيك يا فندم، عندنا عطر عود ملكي بسعر ألف ومية جنيه، وريحته بتفضل طول اليوم.'
          LONG="$SHORT تحب أقترح عليك كمان اختيارات تانية؟ عندنا مسك أبيض ناعم، وعنبر دافي، وعطور فرنساوي فخمة، وكلها أصلية ومضمونة، والشحن لحد باب البيت في أي محافظة في مصر خلال يومين تلاتة."
          for m in gemini-3.8-flash-lite-tts gemini-3.8-flash-tts; do for which in SHORT LONG; do
            t="${!which}"
            jq -n --arg t "Say this in a Egyptian Arabic accent, warm and friendly, natural conversational pace: $t" --arg v Achird \
              '{contents:[{role:"user",parts:[{text:$t}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$v}}}}}' > /tmp/b.json
            s=$(date +%s.%N)
            code=$(curl -sS -m 60 -o /tmp/r.json -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d @/tmp/b.json "$A/$m:generateContent")
            e=$(date +%s.%N)
            mime=$(jq -r '.candidates[0].content.parts[0].inlineData.mimeType // "none"' /tmp/r.json)
            jq -r '.candidates[0].content.parts[0].inlineData.data // ""' /tmp/r.json | base64 -d > /tmp/a.wav 2>/dev/null
            bytes=$(wc -c < /tmp/a.wav)
            base64 -w0 /tmp/a.wav > /tmp/a.b64
            jq -n --rawfile d /tmp/a.b64 '{contents:[{parts:[{inlineData:{mimeType:"audio/wav",data:$d}},{text:"Transcribe this audio exactly, word for word, in the language spoken. Output only the transcript."}]}]}' > /tmp/tb.json
            tr=$(curl -sS -m 60 -H "$H" -H 'Content-Type: application/json' -d @/tmp/tb.json "$A/gemini-2.5-flash:generateContent" | jq -r '.candidates[0].content.parts[0].text // .error.message // "?"')
            note "$m $which" "HTTP $code in $(echo "$e - $s" | bc)s, $mime, $bytes bytes (~$(echo "$bytes / 48000" | bc)s audio). HEARD: $tr"
          done; done
