name: Voice probe (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live voice server
        run: |
          B=https://sham-perfume-49bf.vercel.app
          note() { echo "::notice title=$1::$(printf '%s' "$2" | head -c 900 | tr '\n\r' '  ')"; }
          note health "$(curl -sS -m 20 $B/api/health | head -c 600)"
          note status "$(curl -sS -m 20 -i $B/api/voice/status | head -c 700)"
          for t in 'أهلاً بيك' 'Hello there'; do
            h=$(curl -sS -m 40 -o /tmp/out.bin -D - -X POST -H 'Content-Type: application/json' -H 'Origin: https://spculculat-oss.github.io' \
              --data "{\"text\":\"$t\",\"language\":\"ar\",\"gender\":\"male\"}" $B/api/voice/speak | head -c 600)
            note "speak $t" "$h BODY($(wc -c < /tmp/out.bin) bytes): $(head -c 200 /tmp/out.bin | tr -cd '[:print:]')"
          done
          note after "$(curl -sS -m 20 $B/api/voice/status)"
          note preflight "$(curl -sS -m 20 -i -X OPTIONS -H 'Origin: https://spculculat-oss.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' $B/api/voice/speak | head -c 600)"
