name: Voice probe (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Per-minute limits of each speech model (codes and quota names only, never the key)
        run: |
          note() { echo "::notice title=$1::$(printf '%s' "$2" | head -c 1800 | tr '\n\r' '  ')"; }
          A=https://generativelanguage.googleapis.com/v1beta/models
          H="x-goog-api-key: $GEMINI_API_KEY"
          sleep 65
          for m in gemini-3.8-flash-lite-tts gemini-3.8-flash-tts gemini-2.5-flash-preview-tts gemini-3.1-flash-tts-preview; do
            log=""; detail=""
            for n in 1 2 3 4 5 6 7 8; do
              jq -n --arg t "Say this in a Egyptian Arabic accent, warm: أهلاً بيك رقم $n" '{contents:[{role:"user",parts:[{text:$t}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Achird"}}}}}' > /tmp/b.json
              code=$(curl -sS -m 60 -o /tmp/r.json -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d @/tmp/b.json "$A/$m:generateContent")
              log="$log $n:$code@$(date +%S)"
              if [ "$code" = 429 ] && [ -z "$detail" ]; then detail=$(jq -c '[.error.details[]? | {t:."@type", v:(.violations // .retryDelay)}]' /tmp/r.json); fi
            done
            note "$m" "$log | $detail"
          done
