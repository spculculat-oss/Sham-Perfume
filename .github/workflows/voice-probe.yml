name: Voice probe (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Probe the speech engine (status and error text only, never the key)
        run: |
          note() { echo "::notice title=$1::$(printf '%s' "$2" | head -c 1200 | tr '\n\r' '  ')"; }
          [ -n "$GEMINI_API_KEY" ] || { note key "no GEMINI_API_KEY secret"; exit 0; }
          A=https://generativelanguage.googleapis.com/v1beta
          H="x-goog-api-key: $GEMINI_API_KEY"
          note models "$(curl -sS -m 30 -H "$H" "$A/models?pageSize=1000" | grep -o '"name": "models/[^"]*tts[^"]*"' | tr '\n' ' ')"
          for m in gemini-3.8-flash-lite-tts gemini-3.8-flash-tts gemini-3.1-flash-tts-preview gemini-2.5-flash-preview-tts; do
            body="{\"model\":\"$m\",\"input\":[{\"type\":\"user_input\",\"content\":[{\"type\":\"text\",\"text\":\"أهلاً بيك\",\"annotations\":[{\"type\":\"speech_metadata\",\"style\":\"Egyptian Arabic accent, warm and friendly\"}]}]}],\"response_format\":{\"type\":\"audio\",\"mime_type\":\"audio/wav\",\"sample_rate\":16000},\"generation_config\":{\"speech_config\":[{\"voice\":\"Achird\"}]},\"store\":false}"
            code=$(curl -sS -m 60 -o /tmp/i.json -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d "$body" "$A/interactions")
            note "interactions $m" "HTTP $code $(head -c 700 /tmp/i.json | sed 's/"data": *"[^"]*"/"data":"<audio>"/g')"
            gc="{\"contents\":[{\"parts\":[{\"text\":\"Say in a warm Egyptian Arabic accent: أهلاً بيك\"}]}],\"generationConfig\":{\"responseModalities\":[\"AUDIO\"],\"speechConfig\":{\"voiceConfig\":{\"prebuiltVoiceConfig\":{\"voiceName\":\"Achird\"}}}}}"
            code=$(curl -sS -m 60 -o /tmp/g.json -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d "$gc" "$A/models/$m:generateContent")
            note "generateContent $m" "HTTP $code $(head -c 500 /tmp/g.json | sed 's/"data": *"[^"]*"/"data":"<audio>"/g')"
          done
