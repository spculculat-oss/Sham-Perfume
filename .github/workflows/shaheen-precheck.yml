name: Shaheen pre-meeting full check

# «الفحص الشامل قبل الاجتماع»: two hours before «مجلس شاهين» (08:15 UTC) every robot and AI tool under
# Shaheen's umbrella (src/utils/shaheenOrg.ts) is checked on its own report and its last run — problems, the fix
# it proposes, and development ideas — and the secretary («مشرف شاهين») routes help requests between the tools.
# The meeting reads the result as its agenda. Code: scripts/shaheen-council/precheck.ts.
# Result: src/data/live/shaheen-precheck.json (admin → «إدارة الذكاء الاصطناعي» → «الهيكل الإداري»).
# No AI key is used. If the meeting time changes, keep this two hours before it.

on:
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths: ['scripts/shaheen-council/precheck*', 'scripts/shaheen-council/runs.ts', 'src/utils/shaheenOrg.ts', '.github/workflows/shaheen-precheck.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: shaheen-precheck-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Every robot checks itself
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Branch pushes rehearse: the check is shown in the job summary; nothing is committed.
      PRECHECK_COMMIT: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Full check of every tool
        run: node --import tsx scripts/shaheen-council/precheck.mts
      - name: Publish the agenda on main
        if: env.PRECHECK_COMMIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen precheck bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/publish.mjs "شاهين: الفحص الشامل قبل الاجتماع $(date -u +%Y-%m-%d)" src/data/live/shaheen-precheck.json \
            || { echo "::error::Could not push the pre-meeting check"; exit 1; }
