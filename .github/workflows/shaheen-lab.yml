name: Shaheen's experiments lab (daily)

# «معمل شاهين للتجارب والابتكار» — روبوت «المُجرِّب»: كل يوم يكتب تقرير المعمل الحي
# (src/data/live/shaheen-lab.json) من محتوى المعمل الحقيقي (src/utils/shaheenLab.ts + shaheenLabCatalog.ts):
# تغطية كل مجال بالتجارب والأبحاث والمنتجات، وخريطة التعاون بين العلوم. لا نتائج مزيفة —
# كل رقم مشتق من المحتوى الموثّق، وتنفيذ التجارب على الأرض يوثَّق في التقارير اللاحقة.
# يعمل يومياً الساعة 06:20 UTC، ويدعم التشغيل اليدوي، والتجربة على فروع arena/** بدون نشر.

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['src/utils/shaheenLab*.ts', 'scripts/shaheen-lab/**', '.github/workflows/shaheen-lab.yml']

permissions:
  contents: write

concurrency:
  group: shaheen-lab-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # «مفتاح صاحب الموقع»: the owner (or «دولة المنصة») can pause this robot («lab»).
  owner:
    name: Owner's switch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Read the owner's switches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/data/owner
            scripts/owner
      - name: May this robot run?
        id: gate
        run: node scripts/owner/gate.mjs lab

  lab:
    name: «المُجرِّب» — the experiments lab report
    needs: owner
    if: needs.owner.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: «المُجرِّب» — write the lab report (real content only)
        run: node --import tsx scripts/shaheen-lab/run.mts
      - name: Regression tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test.log || { grep -E 'not ok|error:' /tmp/test.log | head -8 | sed 's/^/::error title=test::/'; exit 1; }
      - name: Publish on main
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          node scripts/ci/publish.mjs "معمل شاهين للتجارب $(date -u +%Y-%m-%dT%H:%MZ)" \
            src/data/live/shaheen-lab.json \
            || { echo "::error::Could not push the lab report"; exit 1; }
          if [ "$(git rev-parse HEAD)" = "$before" ]; then exit 0; fi
          gh workflow run pages.yml --ref main || echo "::warning::Pages rebuild not started"
