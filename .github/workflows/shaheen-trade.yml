name: Shaheen trade lanes — who ships, from where, and at what price

# «روبوت الشحن والتجارة الدولية» (store cell, src/utils/shaheenOrg.ts). The merchant's rule: we are an intermediary.
# Either the source platform delivers worldwide — we only broker — or it is local-only and we carry the parcel, which
# is a local carrier at home and an international one across a border. Every day this robot reads the real files and
# reports: the lane of every destination, the carrier's published band against what we charge, the customs of each
# country (with its source and date), the trade agreement that could take the duty off (GAFTA, Egypt–EU), and the
# perfume rule (UN1266 class 3 — most air carriers refuse it). Result: src/data/live/trade-lanes.json.
# It arranges nothing itself, promises nothing to a visitor, and invents no price.
# The published carrier-cost table is generated with the report and must be published in the same commit.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'scripts/shaheen-trade/**'
      - 'src/data/shipping-lanes.json'
      - 'src/data/customs.json'
      - 'src/data/shipping.json'
      - '.github/workflows/shaheen-trade.yml'

permissions:
  contents: write

concurrency:
  group: shaheen-trade-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # «مفتاح صاحب الموقع»: the owner (or «دولة المنصة») can pause this robot («trade_lanes»).
  owner:
    name: Owner's switch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Read the owner's switches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/data/owner
            scripts/owner
      - name: May this robot run?
        id: gate
        run: node scripts/owner/gate.mjs trade_lanes

  lanes:
    name: «الشحن والتجارة» — local and international lanes, customs and carriers
    needs: owner
    if: needs.owner.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Write the trade report
        run: node --import tsx scripts/shaheen-trade/run.mts
      - name: Behaviour tests
        run: node --import tsx --test tests/tradeLanes.test.ts
      - name: Publish on main
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen trade bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/publish.mjs "شاهين: الشحن والتجارة الدولية $(date -u +%Y-%m-%dT%H:%MZ)" \
            src/data/live/trade-lanes.json \
            src/data/shipping-costs.json \
            || { echo "::error::Could not push the trade report and its carrier-cost table"; exit 1; }
