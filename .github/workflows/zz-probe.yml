name: Temporary speed probe
on: pull_request
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Where the time goes
        run: |
          ZZ_DEBUG=1 timeout 600 node --import tsx scripts/zz-speed-probe.mts > /tmp/out.txt 2>&1 || true
          grep -v "^\s*$" /tmp/out.txt | grep -iv "key\|token" | head -80 > /tmp/o2.txt
          split -l 20 /tmp/o2.txt /tmp/part_
          for f in /tmp/part_*; do echo "::notice title=$(basename $f)::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"; done
