name: Shaheen AI keys (verify + sync to Vercel)

# Keys live ONLY in repository secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, MANUS_API_KEY (background agent),
#   optional OPENROUTER_API_KEY, PERPLEXITY_API_KEY (answers with a live web search), AI_GATEWAY_API_KEY, YOUTUBE_API_KEY (videos under Shaheen's answers),
#   KASHIER_MERCHANT_ID, KASHIER_API_KEY, KASHIER_SECRET_KEY, KASHIER_MODE (store payments),
#   and VERCEL_TOKEN for the sync.
# 1) every present key gets one tiny real request through the site's own engine code;
# 2) working keys are copied to the Vercel projects and production is redeployed if anything changed.
# GitHub Pages has no server: it talks to the Vercel API, so both sites use the synced keys.
# Run it again from the Actions tab ("Run workflow") whenever you add or rotate a key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaheen-keys
  cancel-in-progress: false

jobs:
  keys:
    # A PR/rehearsal must not copy payment keys or redeploy production.
    if: github.ref == 'refs/heads/main'
    name: Verify and sync Shaheen keys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Background task agent only (verified here, never copied to Vercel: visitors never reach it).
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # «الدفع في متجر شام» (Kashier): checked with one unpaid 1 EGP test session, then copied to Vercel.
      KASHIER_MERCHANT_ID: ${{ secrets.KASHIER_MERCHANT_ID }}
      KASHIER_API_KEY: ${{ secrets.KASHIER_API_KEY }}
      KASHIER_SECRET_KEY: ${{ secrets.KASHIER_SECRET_KEY }}
      KASHIER_MODE: ${{ secrets.KASHIER_MODE || vars.KASHIER_MODE || 'test' }}
      KASHIER_CURRENCIES: ${{ vars.KASHIER_CURRENCIES || 'EGP' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'sham-de37' }}
      VERCEL_PROJECTS: ${{ vars.VERCEL_PROJECTS || 'sham-perfume-49bf' }}
      SHAM_VERIFY_FILE: ${{ github.workspace }}/../shaheen-verify.json
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify each AI key with a real request
        run: node --import tsx scripts/verify-ai-keys.mts
      - name: Verify the payment keys (Kashier) with a real test session
        run: node --import tsx scripts/verify-payments.mts
      - name: Sync working keys to Vercel and redeploy
        run: node scripts/sync-vercel-env.mjs
