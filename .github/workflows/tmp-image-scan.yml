name: TEMP image source-mark scan
on:
  push:
    branches: [arena/0c21b935-sham-perfume]
    paths: [.github/workflows/tmp-image-scan.yml, scripts/shaheen-images/scan.py]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: pip install -q pillow
      - run: python3 scripts/shaheen-images/scan.py
      - run: |
                    git config user.name "scan bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-scan && git commit -qm "TEMP: image scan results" && git push -q origin HEAD:arena/0c21b935-sham-perfume
