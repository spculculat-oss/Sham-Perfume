name: Live Shaheen check

# Asks the deployed site real visitor questions and checks the whole site from a visitor's point of
# view (the dev sandbox cannot reach it). Runs daily too, so a broken deploy or an overwritten main
# shows up as a failed run. Results: job summary + annotations.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to test
        default: https://sham-perfume-49bf.vercel.app
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: ['arena/**']
    paths: ['scripts/live-smoke.mjs', 'scripts/live-site-check.mjs', '.github/workflows/live-smoke.yml']

permissions:
  contents: read

jobs:
  ask:
    name: Ask Shaheen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ inputs.site_url || 'https://sham-perfume-49bf.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Site, API and CORS
        run: node scripts/live-site-check.mjs
      - name: Ask live questions
        if: always()
        run: node scripts/live-smoke.mjs
