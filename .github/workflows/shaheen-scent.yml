name: Shaheen scent behaviour — the visitor's perfume choices

# «روبوت سلوك الزائر العطري» (experience cell, src/utils/shaheenOrg.ts): every day it reads the anonymous counters of
# the designs visitors chose to share in «معمل المصممين» (material ids, type and a coarse band only — no names, no
# titles, no personal data), compares them with the lab's material bank, the raw-materials encyclopedia and the
# storefront's families, and proposes concrete materials to add. Result: src/data/live/scent-behavior.json
# (admin → «إدارة الذكاء الاصطناعي» → «الهيكل الإداري», «الفحص الشامل» and the council).
#
# Minute 17: clear of the State (27), inventory (5), importer (37), school clock (47), patrol (52), pre-check (10)
# and the customer-care desk (3).

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'scripts/shaheen-scent/**'
      - 'src/utils/labSignals.ts'
      - 'src/utils/designers/perfumeMaterials.ts'
      - 'src/data/rawMaterials.ts'
      - 'src/data/products.json'
      - '.github/workflows/shaheen-scent.yml'

permissions:
  contents: write

concurrency:
  group: shaheen-scent-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # «مفتاح صاحب الموقع»: the owner (or «دولة المنصة») can pause this robot («scent_behavior»).
  owner:
    name: Owner's switch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Read the owner's switches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/data/owner
            scripts/owner
      - name: May this robot run?
        id: gate
        run: node scripts/owner/gate.mjs scent_behavior

  scent:
    name: «سلوك الزائر العطري» — shared designs and material proposals
    needs: owner
    # Branch rehearsals analyse the repository content only; the live counters are read on main alone.
    if: needs.owner.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHAM_SCENT_API_URL: ${{ vars.SHAM_SCENT_API_URL || 'https://sham-perfume-49bf.vercel.app' }}
      SHAM_ADMIN_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SHAM_ADMIN_TOKEN || '' }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Write the scent-behaviour report (real counters or «not read»)
        run: node --import tsx scripts/shaheen-scent/run.mts
      - name: Behaviour tests
        run: node --import tsx --test tests/scentBehavior.test.ts
      - name: Publish on main
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen scent bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/publish.mjs "شاهين: سلوك الزائر العطري $(date -u +%Y-%m-%dT%H:%MZ)" \
            src/data/live/scent-behavior.json \
            || { echo "::error::Could not push the scent-behaviour report"; exit 1; }
