name: Shaheen senses — site data and world data

# «حسّاسات شاهين» (src/utils/shaheenOrg.ts + scripts/shaheen-senses/). كل 6 ساعات تقرأ البيانات:
#   · «حسّاسات الموقع»: تقرأ بيانات الموقع نفسه (منتجات، أسعار، تكلفة، شحن، جمارك، أسعار صرف، تقارير العقل الحية)
#     وترسل عن حداثتها وثغراتها من غير ما تغير حاجة. كل رقم مع مصدره وتاريخه.
#   · «حسّاسات العالم»: تقرأ صفحات شركات الشحن في العالم بأدب (robots.txt أولًا، صفحة واحدة لكل شركة، ميزانية صغيرة)
#     وتُسجل اللي شفته فقط: هل الصفحة فُتحت؟ فيها مواد خطر؟ من غير اختراع أي سعر.
# لا روبوت هنا يغيّر سعر ولا يعد بتوصيل: الأسعار والوعود قرار صاحب المتجر.

on:
  schedule:
    # كل 6 ساعات، بعد سينابس وب sebelum الفحص الشامل.
    - cron: '13 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'scripts/shaheen-senses/**'
      - 'src/data/shipping.json'
      - 'src/data/shipping-costs.json'
      - 'src/data/shipping-lanes.json'
      - 'src/data/customs.json'
      - 'src/data/live/fx-rates.json'
      - 'src/data/live/trade-lanes.json'
      - 'src/data/products.json'
      - 'src/data/carrier-candidates.json'
      - '.github/workflows/shaheen-senses.yml'

permissions:
  contents: write

concurrency:
  group: shaheen-senses-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  owner:
    name: Owner's switch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Read the owner's switches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/data/owner
            scripts/owner
      - name: May these robots run?
        id: gate
        run: node scripts/owner/gate.mjs senses_site senses_world

  senses:
    name: «حسّاسات الموقع» و«حسّاسات العالم»
    needs: owner
    if: needs.owner.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Run the senses robots
        run: node --import tsx scripts/shaheen-senses/run.mts
      - name: Behaviour tests
        run: node --import tsx --test tests/shaheenSenses.test.ts
      - name: Publish on main
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shaheen senses"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/publish.mjs "شاهين: حسّاسات الموقع والعالم $(date -u +%Y-%m-%dT%H:%MZ)" \
            src/data/live/senses-site.json \
            src/data/live/senses-world.json \
            || { echo "::error::Could not push the senses reports"; exit 1; }
