name: TEMP crop
on:
  push:
    branches: [arena/0c21b935-sham-perfume]
    paths: [scripts/shaheen-images/crop.py]
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install -q pillow && python3 scripts/shaheen-images/crop.py
      - run: |
          git config user.name "scan bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-scan && git commit -qm "TEMP: zooms" && git push -q origin HEAD:arena/0c21b935-sham-perfume
