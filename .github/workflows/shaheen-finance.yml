name: Shaheen finance — daily audit and periodic reports

on:
  schedule:
    # 03:15 UTC, always after midnight in Cairo (DST-aware period boundaries are in the service).
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaheen-finance
  cancel-in-progress: false

jobs:
  audit:
    # Never run against production from a feature-branch push or manual rehearsal.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHAM_FINANCE_API_URL: ${{ vars.SHAM_FINANCE_API_URL }}
      SHAM_ADMIN_TOKEN: ${{ secrets.SHAM_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run private finance audit
        run: node --import tsx scripts/shaheen-finance/run.mts
