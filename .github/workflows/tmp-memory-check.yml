name: TEMP memory live check
on:
  push:
    branches: [arena/dc2502ec-sham-perfume]
    paths: [.github/workflows/tmp-memory-check.yml]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          API=https://sham-perfume-49bf.vercel.app/api
          echo "::notice title=health::$(curl -s $API/health)"
          Q='{"message":"كم يوم أعتق عطر فيه مسك وعنبر وعود؟","model":"auto","language":"ar","conversationHistory":[]}'
          for i in 1 2; do
            start=$(date +%s%3N)
            R=$(curl -s -X POST $API/chat -H 'content-type: application/json' -d "$Q")
            ms=$(( $(date +%s%3N) - start ))
            echo "::notice title=shared-file question $i (${ms}ms)::$(echo "$R" | jq -c '{memory, mode, len:(.reply|length), code, head:(.reply // "" | .[0:80])}')"
          done
          Q2='{"message":"ما هو أفضل مثبت لعطر حمضيات منعش؟","model":"auto","language":"ar","conversationHistory":[]}'
          for i in 1 2; do
            start=$(date +%s%3N)
            R=$(curl -s -X POST $API/chat -H 'content-type: application/json' -d "$Q2")
            ms=$(( $(date +%s%3N) - start ))
            echo "::notice title=new question $i (${ms}ms)::$(echo "$R" | jq -c '{memory, mode, len:(.reply|length), code}')"
          done
