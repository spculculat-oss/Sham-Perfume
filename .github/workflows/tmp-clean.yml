name: TEMP image clean check
on:
  push:
    branches: ['arena/0c21b935-sham-perfume']
    paths: ['.github/workflows/tmp-clean.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lama
          key: big-lama-v0.1.0
      - name: clean
        env:
          IMAGE_ONLY: "https://www.shamperfume.com/cdn/large/oud-mood-30ml-by-lattafa-edp-unisex-1.jpg,https://www.shamperfume.com/cdn/large/malik-al-tayoor-concentrated-100ml-by-lattafa-1.jpg,https://www.shamperfume.com/cdn/large/a7600560-dbf4-42c1-7857-285ebd4bf600.jpg,https://www.shamperfume.com/cdn/large/sheikh-al-shuyukh-supreme-by-lattafa-100ml-edp-4.jpg,https://www.shamperfume.com/cdn/large/malik-al-tayoor-concentrated-100ml-by-lattafa-8.jpg,https://www.shamperfume.com/cdn/large/20862eff-545f-4cfc-c005-e804e9d93000.jpg,https://www.shamperfume.com/cdn/large/zimaya-amber-is-great-eau-de-parfum-100ml-3.jpg,https://www.shamperfume.com/cdn/large/perfumes/volare/minyak-wangi-lelaki-gladiator-twilight-elixir-volare-tahan-lama-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/al-khas-winners-trophy-gold-100ml-by-lattafa-pride-7.jpg,https://www.shamperfume.com/cdn/large/perfumes/lattafa/perfume-lelaki-hayaati-al-maleky-box-original-malaysia-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/zimaya-amber-is-great-eau-de-parfum-100ml-4.jpg,https://www.shamperfume.com/cdn/large/oud-mood-reminiscence-lattafa-100ml-3.jpg,https://www.shamperfume.com/cdn/large/al-qannas-eau-de-parfum-100ml-by-ard-al-zaafaran-7.jpg,https://www.shamperfume.com/cdn/large/perfumes/afnan/9am-dive-afnan-botol-wangian-lelaki-citrus-marine-malaysia-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/perfumes/armaf/odyssey-spectra-armaf-lelaki-citrus-berangin-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/perfumes/volare/minyak-wangi-lelaki-gladiator-twilight-le-beau-tahan-lama-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/5c6455a0-e9f8-4759-1f44-7c6968e18a00.jpg,https://www.shamperfume.com/cdn/large/perfumes/ard-al-zaafaran/arabian-night-oud-amber-woody-perfume-man-100ml-edp.jpg,https://www.shamperfume.com/cdn/large/perfumes/lattafa/hayaati-gold-elixir-by-lattafa-100ml-edp-malaysia.jpg,https://www.shamperfume.com/cdn/large/angham-second-song-by-lattafa-100ml-1.jpg"
          IMAGE_WRITE_PRODUCTS: '0'
        run: |
          pip install -q rapidocr_onnxruntime pillow numpy
          python3 scripts/shaheen-images/test_detect.py
          python3 scripts/shaheen-images/clean.py
      - name: before/after
        run: |
          python3 - <<'PY'
          import json, urllib.request, io
          from PIL import Image
          r = json.load(open('src/data/live/image-clean.json'))['images']
          UA = {'User-Agent': 'Mozilla/5.0 (compatible; ShaheenImporter/1.0)'}
          n = 0
          for url, v in r.items():
              if not isinstance(v, dict) or v.get('s') != 'edited': continue
              a = Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(url, headers=UA)).read())).convert('RGB')
              b = Image.open('public/' + v['f']).convert('RGB')
              s = Image.new('RGB', (a.width * 2 + 20, a.height), 'red'); s.paste(a, (0, 0)); s.paste(b, (a.width + 20, 0))
              s.resize((s.width // 2, s.height // 2)).save(f'tmp-scan/ba-{n}.jpg', quality=88)
              print('::notice::', n, url, json.dumps(v)[:300]); n += 1
          print('::notice::summary', json.dumps({k: (v if isinstance(v, str) else v['s']) for k, v in r.items()})[:900])
          PY
          cp src/data/live/image-clean.json tmp-scan/registry.json
          mkdir -p tmp-scan/clean && cp public/store-images/* tmp-scan/clean/ || true
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-scan && git commit -qm "TEMP: clean check" && git push -q origin HEAD:arena/0c21b935-sham-perfume
